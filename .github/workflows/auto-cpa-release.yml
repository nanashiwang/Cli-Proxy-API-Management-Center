name: auto-cpa-release

on:
  # Publish only verified mainline changes.
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-cpa-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: >-
      github.repository == 'nanashiwang/Cli-Proxy-API-Management-Center' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify before tagging
        run: |
          bun install --frozen-lockfile
          bun run verify
      - name: Create next CPA tag and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          latest_cpa_tag="$(git tag --list 'v*-cpa.*' | sort -V | tail -n 1 || true)"
          if [[ -n "${latest_cpa_tag}" ]]; then
            base_version="$(sed -E 's/^v(.*)-cpa\.[0-9]+$/\1/' <<<"${latest_cpa_tag}")"
            last_number="$(sed -E 's/^v.*-cpa\.([0-9]+)$/\1/' <<<"${latest_cpa_tag}")"
          else
            base_version="1.0.0"
            last_number=0
          fi

          next_number=$((last_number + 1))
          tag="v${base_version}-cpa.${next_number}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${tag}"
          echo "Dispatched frontend release: ${tag}"
