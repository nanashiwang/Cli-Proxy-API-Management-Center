name: auto-cpa-release

on:
  # Publish only verified mainline changes.
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-cpa-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: >-
      github.repository == 'nanashiwang/Cli-Proxy-API-Management-Center' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Verify before tagging
        run: |
          bun install --frozen-lockfile
          bun run verify
      - name: Create next CPA tag and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # Follow the latest stable upstream tag that is actually merged into this release.
          base_version="$(git tag --merged "${GITHUB_SHA}" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)(-cpa\.[0-9]+)?$/\1/p' | sort -V | tail -n 1)"
          [[ -n "${base_version}" ]] || { echo 'No merged release baseline'; exit 1; }
          existing_tag="$(git tag --points-at "${GITHUB_SHA}" --list "v${base_version}-cpa.*" | sort -V | tail -n 1)"
          if [[ -n "${existing_tag}" ]]; then
            echo "Already tagged: ${existing_tag}"
            gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${existing_tag}"
            exit 0
          fi
          last_number="$(git tag --list "v${base_version}-cpa.*" | sed -nE 's/^.*-cpa\.([0-9]+)$/\1/p' | sort -n | tail -n 1)"
          next_number=$(( ${last_number:-0} + 1 ))
          tag="v${base_version}-cpa.${next_number}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${tag}" "${GITHUB_SHA}" -m "发布 ${tag}"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${tag}"
          echo "Dispatched frontend release: ${tag}"
