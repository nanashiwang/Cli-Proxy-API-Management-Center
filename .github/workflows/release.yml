name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: personal-frontend-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify mainline release source
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" == 'nanashiwang/Cli-Proxy-API-Management-Center' ]]; then
            [[ "${GITHUB_REF_TYPE}" == 'tag' ]] || { echo 'Publish through a mainline tag'; exit 1; }
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cpa\.[0-9]+$ ]] || exit 1
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit is not on main'; exit 1; }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify and build all-in-one HTML
        run: bun run verify
        env:
          VERSION: ${{ github.ref_name }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="${current_tag}"
          fi

          : > release-notes.md
          git log --pretty=format:"- %h %s" "${range}" >> release-notes.md

      - name: Select latest version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          newest="$(printf '%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -n 1)"
          if [[ "$newest" == "$GITHUB_REF_NAME" ]]; then echo 'value=true' >> "$GITHUB_OUTPUT"; else echo 'value=false' >> "$GITHUB_OUTPUT"; fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: ${{ steps.latest.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
